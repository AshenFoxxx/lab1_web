{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="section">
    <div class="container narrow">
        <div class="panel">
            <h1>Кабинет мастерской</h1>
            <p>После входа можно менять страницы, прайс, галерею и смотреть заявки на ТО.</p>
            <form method="post" class="form-grid">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn--accent" type="submit">Войти</button>
            </form>
            <p class="hint">Демо: <code>admin</code> / <code>admin123</code></p>
            <p>Нет аккаунта? <a href="{% url 'club:register' %}">Регистрация</a></p>
        </div>
    </div>
</section>
{% endblock %}
