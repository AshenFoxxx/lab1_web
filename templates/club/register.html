{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="section">
    <div class="container narrow">
        <div class="panel">
            <h1>Регистрация</h1>
            <p>Зарегистрированный пользователь может создавать, изменять и удалять страницы сайта.</p>
            <form method="post" class="form-grid">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn--accent" type="submit">Создать аккаунт</button>
            </form>
            <p>Уже есть аккаунт? <a href="{% url 'club:login' %}">Войти</a></p>
        </div>
    </div>
</section>
{% endblock %}
